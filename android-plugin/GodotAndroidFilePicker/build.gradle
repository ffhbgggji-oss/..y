plugins {
    id 'com.android.library'
}

android {
    namespace 'org.godotengine.plugin.filepicker'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Godot Android plugin API. Keep this aligned with the Godot editor/export templates.
    implementation 'org.godotengine:godot:4.2.1.stable'
}
