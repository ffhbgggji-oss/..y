name: CartoonStudio Android Build

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            cmdline-tools;latest
            ndk;23.2.8568313
            cmake;3.10.2.4988404

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2.1-bin.zip
          unzip -q gradle-8.2.1-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.2.1/bin" >> "$GITHUB_PATH"

      - name: Download Godot 4.2.1
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"

          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip

          unzip -q Godot_v4.2.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.2.1-stable_linux.x86_64

      - name: Download Android Export Templates
        run: |
          cd "$RUNNER_TEMP"

          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz

          mkdir -p templates
          unzip -q Godot_v4.2.1-stable_export_templates.tpz -d templates

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.2.1.stable"
          mkdir -p "$TEMPLATE_DIR"

          cp -a templates/templates/. "$TEMPLATE_DIR/"

          test -f "$TEMPLATE_DIR/android_source.zip"

      - name: Build Android File Picker Plugin
        run: |
          gradle --no-daemon --max-workers=2 \
            -p android-plugin \
            :GodotAndroidFilePicker:assembleRelease

          mkdir -p addons/GodotAndroidFilePicker/bin/release

          AAR=$(find android-plugin/GodotAndroidFilePicker/build \
            -name "GodotAndroidFilePicker-release.aar" | head -n 1)

          test -n "$AAR"

          cp "$AAR" addons/GodotAndroidFilePicker/bin/release/GodotAndroidFilePicker.aar

      - name: Check Godot Project
        run: |
          test -f project.godot
          test -f export_presets.cfg
          test -f icon.png

      - name: Import Godot Project
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.2.1-stable_linux.x86_64"

          "$GODOT" --headless --editor \
            --path "$GITHUB_WORKSPACE" \
            --import --quit

      - name: Install Android Build Template
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.2.1.stable"

          rm -rf android
          mkdir -p android/build

          printf '4.2.1.stable\n' > android/.build_version
          touch android/build/.gdignore

          unzip -q -o "$TEMPLATE_DIR/android_source.zip" -d android/build

          mkdir -p android/build

          touch android/build/gradle.properties

          cat >> android/build/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          EOF

          test -f android/build/build.gradle

      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storetype PKCS12 \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 10000 \
            -keyalg RSA \
            -keysize 2048

      - name: Build CartoonStudio APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build

          GODOT="$RUNNER_TEMP/godot/Godot_v4.2.1-stable_linux.x86_64"

          "$GODOT" --headless \
            --path "$GITHUB_WORKSPACE" \
            --verbose \
            --export-debug "Android" \
            build/CartoonStudio-debug.apk

          test -s build/CartoonStudio-debug.apk

      - name: Verify APK
        run: |
          unzip -t build/CartoonStudio-debug.apk

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            verify --verbose build/CartoonStudio-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CartoonStudio-Android-APK
          path: build/CartoonStudio-debug.apk
          if-no-files-found: error
          retention-days: 14
