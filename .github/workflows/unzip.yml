name: Build CartoonStudio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip CartoonStudio
        run: |
          if [ -f "CartoonStudio-ready.zip" ]; then
            unzip -oq CartoonStudio-ready.zip -d .
            rm CartoonStudio-ready.zip

            test -f project.godot

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Extract CartoonStudio ZIP [skip ci]"
              git push
            fi
          else
            echo "ZIP not found"
            test -f project.godot
          fi
