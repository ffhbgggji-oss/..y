name: Extract project ZIP

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          python3 -m zipfile -e CartoonStudio-repaired.zip extracted

          ROOT=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -d "$ROOT" ]; then
            rsync -a --exclude='.git' --exclude='.github' "$ROOT"/ ./
          else
            rsync -a --exclude='.git' --exclude='.github' extracted/ ./
          fi

          rm -rf extracted project
          rm -f CartoonStudio-repaired.zip

      - name: Save files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move project files to repository root" || true
          git push
