name: Build CartoonStudio APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Получение репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Распаковка проекта
      - name: Unzip CartoonStudio
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

          ARCHIVE="CartoonStudio-animation-preserved-fixed.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: ZIP archive not found!"
            exit 1
          fi

          unzip -oq "$ARCHIVE" -d .

          if [ ! -f project.godot ]; then
            echo "ERROR: project.godot not found after extraction!"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "CartoonStudio successfully extracted."

      # 3. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      # 5. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 6. Установка Android компонентов
      - name: Install Android SDK packages
        timeout-minutes: 15
        run: |
          yes | sdkmanager --licenses

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"

      # 7. Установка Godot 4.2.1
      - name: Install Godot 4.2.1
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip \
            -O godot.zip

          unzip -q godot.zip -d godot-bin

          sudo install -m 0755 \
            godot-bin/Godot_v4.2.1-stable_linux.x86_64 \
            /usr/local/bin/godot

          godot --version

      # 8. Экспортные шаблоны Godot
      - name: Install Godot export templates
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz \
            -O templates.tpz

          mkdir -p templates-extracted

          unzip -q templates.tpz -d templates-extracted

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.2.1.stable"

          mkdir -p "$TEMPLATE_DIR"

          cp -a templates-extracted/templates/. "$TEMPLATE_DIR/"

          if [ -f templates-extracted/version.txt ]; then
            cp templates-extracted/version.txt "$TEMPLATE_DIR/version.txt"
          fi

          test -s "$TEMPLATE_DIR/android_source.zip"
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"

      # 9. Сборка Android File Picker
      - name: Build Android File Picker plugin
        run: |
          if [ -d android-plugin ]; then
            cd android-plugin

            gradle --no-daemon \
              --max-workers=2 \
              :GodotAndroidFilePicker:assembleRelease

            cd ..

            mkdir -p addons/GodotAndroidFilePicker/bin/release

            cp \
              android-plugin/GodotAndroidFilePicker/build/outputs/aar/GodotAndroidFilePicker-release.aar \
              addons/GodotAndroidFilePicker/bin/release/GodotAndroidFilePicker.aar

            test -s addons/GodotAndroidFilePicker/bin/release/GodotAndroidFilePicker.aar
          else
            echo "Android plugin directory not found. Skipping."
          fi

      # 10. Проверка проекта
      - name: Validate Godot project
        run: |
          test -f project.godot
          test -f export_presets.cfg

          godot --headless \
            --editor \
            --path . \
            --quit

      # 11. Подготовка Android Gradle шаблона
      - name: Prepare Android build template
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.2.1.stable"

          test -s "$TEMPLATE_DIR/android_source.zip"

          rm -rf android

          mkdir -p android/build

          printf '4.2.1.stable\n' > android/.build_version

          : > android/build/.gdignore

          unzip -q -o \
            "$TEMPLATE_DIR/android_source.zip" \
            -d android/build

          test -s android/build/build.gradle

          touch android/build/gradle.properties

          cat >> android/build/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      # 12. Создание debug keystore
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -validity 9999 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -deststoretype pkcs12

          test -s "$RUNNER_TEMP/debug.keystore"

      # 13. Настройка подписи APK
      - name: Configure Android signing
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/debug.keystore
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("export_presets.cfg")
          content = path.read_text()

          replacements = {
              'keystore/debug=""':
                  f'keystore/debug="{os.environ["KEYSTORE_PATH"]}"',

              'keystore/debug_user=""':
                  'keystore/debug_user="androiddebugkey"',

              'keystore/debug_password=""':
                  'keystore/debug_password="android"',
          }

          for old, new in replacements.items():
              content = content.replace(old, new)

          path.write_text(content)
          PY

      # 14. Экспорт APK
      - name: Export CartoonStudio APK
        timeout-minutes: 25
        run: |
          mkdir -p build

          godot --headless \
            --path . \
            --verbose \
            --export-debug "Android" \
            build/CartoonStudio-debug.apk

          if [ ! -s build/CartoonStudio-debug.apk ]; then
            echo "ERROR: APK was not created!"
            exit 1
          fi

          echo "APK successfully created."

      # 15. Проверка APK
      - name: Verify APK
        run: |
          unzip -t build/CartoonStudio-debug.apk

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            verify --verbose \
            build/CartoonStudio-debug.apk

          echo "APK verification completed."

      # 16. Загрузка APK
      - name: Upload CartoonStudio APK
        uses: actions/upload-artifact@v4
        with:
          name: CartoonStudio-APK
          path: build/CartoonStudio-debug.apk
          if-no-files-found: error
          retention-days: 14
