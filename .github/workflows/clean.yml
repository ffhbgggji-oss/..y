name: Build CartoonStudio APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Распаковка ZIP
      - name: Unzip CartoonStudio
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

          ARCHIVE="CartoonStudio-full-merged.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ZIP archive not found!"
            exit 1
          fi

          unzip -oq "$ARCHIVE" -d .

          if [ ! -f project.godot ]; then
            echo "project.godot not found!"
            find . -maxdepth 3 -name project.godot
            exit 1
          fi

          echo "Project extracted successfully."

      # Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"

      # Godot 4.2.1
      - name: Install Godot
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip \
            -O godot.zip

          unzip -q godot.zip -d godot-bin

          sudo install -m 0755 \
            godot-bin/Godot_v4.2.1-stable_linux.x86_64 \
            /usr/local/bin/godot

          godot --version

      # Export templates
      - name: Install Godot templates
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz \
            -O templates.tpz

          mkdir templates-extracted
          unzip -q templates.tpz -d templates-extracted

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.2.1.stable"

          mkdir -p "$TEMPLATE_DIR"
          cp -a templates-extracted/templates/. "$TEMPLATE_DIR/"

          test -s "$TEMPLATE_DIR/android_source.zip"

      # Project validation
      - name: Validate project
        run: |
          test -f project.godot
          test -f export_presets.cfg

          godot --headless --editor --path . --quit

      # Android template
      - name: Prepare Android template
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.2.1.stable"

          mkdir -p android/build

          printf '4.2.1.stable\n' > android/.build_version

          unzip -oq \
            "$TEMPLATE_DIR/android_source.zip" \
            -d android/build

          test -f android/build/build.gradle

          touch android/build/gradle.properties

          cat >> android/build/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      # Debug keystore
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -validity 9999 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -deststoretype pkcs12

      # Configure signing
      - name: Configure signing
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/debug.keystore
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("export_presets.cfg")
          content = path.read_text()

          content = content.replace(
              'keystore/debug=""',
              f'keystore/debug="{os.environ["KEYSTORE_PATH"]}"'
          )

          content = content.replace(
              'keystore/debug_user=""',
              'keystore/debug_user="androiddebugkey"'
          )

          content = content.replace(
              'keystore/debug_password=""',
              'keystore/debug_password="android"'
          )

          path.write_text(content)
          PY

      # APK export
      - name: Export APK
        run: |
          mkdir -p build

          godot --headless \
            --path . \
            --export-debug "Android" \
            build/CartoonStudio-debug.apk

          test -s build/CartoonStudio-debug.apk

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CartoonStudio-APK
          path: build/CartoonStudio-debug.apk
          if-no-files-found: error
          retention-days: 14
