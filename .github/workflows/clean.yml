name: Build CartoonStudio APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Распаковка ZIP
      - name: Unzip CartoonStudio
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

          ARCHIVE="CartoonStudio-full-merged.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ZIP archive not found!"
            exit 1
          fi

          unzip -oq "$ARCHIVE" -d .

          if [ ! -f project.godot ]; then
            echo "project.godot not found!"
            find . -maxdepth 3 -name project.godot
            exit 1
          fi

          echo "Project extracted successfully."

      # Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      # Android SDK без setup-android action
      - name: Setup Android SDK
        run: |
          set -e

          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"

          echo "Android SDK ready"

      # Godot 4.2.1
      - name: Install Godot
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip \
            -O godot.zip

          unzip -q godot.zip -d godot-bin

          sudo install -m 0755 \
            godot-bin/Godot_v4.2.1-stable_linux.x86_64 \
            /usr/local/bin/godot

          godot --version
          
      # Сборка Android File Picker
      - name: Build Godot Android File Picker
        run: |
          set -e

          cd android-plugin

          gradle --no-daemon \
            --max-workers=2 \
            :GodotAndroidFilePicker:assembleRelease

          cd ..

          mkdir -p addons/GodotAndroidFilePicker/bin/release

          cp android-plugin/GodotAndroidFilePicker/build/outputs/aar/GodotAndroidFilePicker-release.aar \
             addons/GodotAndroidFilePicker/bin/release/GodotAndroidFilePicker.aar

          test -s addons/GodotAndroidFilePicker/bin/release/GodotAndroidFilePicker.aar
          
      # Export templates
      - name: Install Godot templates
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz \
            -O templates.tpz

          mkdir templates-extracted
          unzip -q templates.tpz -d templates-extracted

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.2.1.stable"

          mkdir -p "$TEMPLATE_DIR"
          cp -a templates-extracted/templates/. "$TEMPLATE_DIR/"

          test -s "$TEMPLATE_DIR/android_source.zip"

      # Project validation
      - name: Validate project
        run: |
          test -f project.godot
          test -f export_presets.cfg

          godot --headless --editor --path . --quit

      # Android template
      - name: Prepare Android template
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.2.1.stable"

          mkdir -p android/build

          printf '4.2.1.stable\n' > android/.build_version

          unzip -oq \
            "$TEMPLATE_DIR/android_source.zip" \
            -d android/build

          test -f android/build/build.gradle

          touch android/build/gradle.properties

          cat >> android/build/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      # Debug keystore
      - name: Generate debug keystore
        run: |
          mkdir -p "$RUNNER_TEMP"

          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -validity 9999 \
            -dname "CN=Android Debug,O=Android,C=US"

          test -f "$RUNNER_TEMP/debug.keystore"

      # Configure signing
      - name: Configure Android signing
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("export_presets.cfg")
          content = path.read_text()

          # Находим Android preset
          match = re.search(
              r'\[preset\.(\d+)\]\s*\n(.*?)(?=\n\[|\Z)',
              content,
              re.S
          )

          if not match or 'name="Android"' not in match.group(2):
              raise RuntimeError("Android export preset not found!")

          index = match.group(1)
          section = f"[preset.{index}.options]"

          if section not in content:
              raise RuntimeError("Android preset options section not found!")

          start = content.index(section)
          end = content.find("\n[", start + len(section))

          if end == -1:
              end = len(content)

          options = content[start:end]

          values = {
              "keystore/debug": f'"{Path.home()}/../.."'  # replaced below
          }

          import os
          keystore = os.environ["RUNNER_TEMP"] + "/debug.keystore"

          replacements = {
              "keystore/debug": keystore,
              "keystore/debug_user": "androiddebugkey",
              "keystore/debug_password": "android"
          }

          for key, value in replacements.items():
              line = f'{key}="{value}"'
              pattern = rf'(?m)^{re.escape(key)}=.*$'

              if re.search(pattern, options):
                  options = re.sub(pattern, lambda _: line, options)
              else:
                  options += "\n" + line

          content = content[:start] + options + content[end:]
          path.write_text(content)

          print("Android debug signing configured.")
          PY
        env:
          RUNNER_TEMP: ${{ runner.temp }}

      # APK export
      - name: Export APK
        run: |
          mkdir -p build

          godot --headless \
            --path . \
            --export-debug "Android" \
            build/CartoonStudio-debug.apk

          test -s build/CartoonStudio-debug.apk

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CartoonStudio-APK
          path: build/CartoonStudio-debug.apk
          if-no-files-found: error
          retention-days: 14
